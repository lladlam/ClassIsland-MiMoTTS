name: Build and Auto Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*.[0-9]*' # 匹配 a.b.c.d 格式版本号标签

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # 必须拉取历史才能获取 commit 内容

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # 1. 编译并打包出 cipx 文件（CI 2.x 和 CI 1.x）
    - name: Publish and Create CIPX
      run: |
        dotnet publish MiMoTTS/MiMoTTS.csproj -c Release -p:CreateCipx=true
        dotnet publish MiMoTTS.CI1/MiMoTTS.CI1.csproj -c Release -p:CreateCipx=true

    # 2. 使用 PowerShell 计算 CIPX 文件的 MD5 校验和
    - name: Calculate MD5
      id: calc_md5
      shell: pwsh
      run: |
        $files = Get-ChildItem -Path "**/cipx/*.cipx"
        if ($files.Count -eq 0) {
            Write-Error "未找到打包生成的 .cipx 文件"
            exit 1
        }
        $fileList = @()
        foreach ($file in $files) {
            $md5 = (Get-FileHash $file.FullName -Algorithm MD5).Hash.ToLower()
            $fileList += "$($file.Name)|$md5|$($file.FullName)"
        }
        "CIPX_FILES=$($fileList -join ';')" | Out-File -FilePath $env:GITHUB_ENV -Append

    # 3. 提取最后一次 commit -m 的内容
    - name: Get Commit Message
      id: commit_msg
      shell: pwsh
      run: |
        # 获取当前标签所在 commit 的提交信息
        $msg = git log -1 --pretty=format:"%s"
        "COMMIT_MSG=$msg" | Out-File -FilePath $env:GITHUB_ENV -Append

    # 4. 拼接 Release 正文（Actions 表达式没有 split 函数，改在 PowerShell 里拼好写入文件）
    - name: Prepare Release Body
      shell: pwsh
      run: |
        $files = @()
        if (-not [string]::IsNullOrWhiteSpace($env:CIPX_FILES)) {
          $files = @($env:CIPX_FILES -split ';')
        }
        $artifactSection = ($files | ForEach-Object { "- $_" }) -join "`n"
        if ([string]::IsNullOrWhiteSpace($artifactSection)) {
          $artifactSection = "- 无产物"
        }
        $body = "### 📦 产物校验信息`n$artifactSection`n`n---`n### 📝 更新日志`n- $($env:COMMIT_MSG)"
        Set-Content -Path release-body.md -Value $body -Encoding utf8
        Get-Content release-body.md

    # 5. 创建 Release 并上传产物（关闭了 GitHub 自身的日志，只用你的 commit 信息）
    - name: Create Release and Upload Asset
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: false # 关闭 GitHub 自带的汇总，避免重复
        body_path: release-body.md
        files: |
          **/cipx/*.cipx
